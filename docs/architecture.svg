<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="ShopAssist architecture from document upload and retrieval to cited answer or human ticket">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="m0 0 10 5-10 5Z" fill="#a39886"/></marker><style>text{font-family:Arial,sans-serif;fill:#4f483b}.title{font-family:Georgia,serif;font-size:35px}.label{font-size:17px;font-weight:600}.sub{font-size:13px;fill:#938571}.box{fill:#fffdf7;stroke:#ded4c1;stroke-width:1.5}.arrow{fill:none;stroke:#a39886;stroke-width:1.7;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="680" rx="20" fill="#f5f2e9"/>
<text class="title" x="45" y="66">ShopAssist</text><text class="sub" x="46" y="94">DOCUMENTS → GROUNDED ANSWERS → HUMAN SUPPORT</text>
<rect class="box" x="45" y="146" width="230" height="105" rx="12"/><text class="label" x="66" y="181">Merchant workspace</text><text class="sub" x="66" y="207">PDF / Markdown · Admin token</text><text class="sub" x="66" y="228">Upload policies and FAQs</text>
<rect class="box" x="338" y="146" width="230" height="105" rx="12"/><text class="label" x="359" y="181">Ingestion · FastAPI</text><text class="sub" x="359" y="207">Page extraction · overlapping chunks</text><text class="sub" x="359" y="228">Local multilingual embeddings</text>
<rect class="box" x="635" y="146" width="230" height="105" rx="12"/><text class="label" x="656" y="181">Qdrant</text><text class="sub" x="656" y="207">Cosine vector search</text><text class="sub" x="656" y="228">Text · document · page metadata</text>
<path class="arrow" d="M275 198H338"/><path class="arrow" d="M568 198H635"/>
<rect class="box" x="45" y="335" width="230" height="110" rx="12"/><text class="label" x="66" y="371">Customer · Next.js</text><text class="sub" x="66" y="397">Question + conversation token</text><text class="sub" x="66" y="420">Citations · thumbs up / down</text>
<rect class="box" x="338" y="335" width="230" height="110" rx="12"/><text class="label" x="359" y="371">Retrieval · FastAPI</text><text class="sub" x="359" y="397">Embed question · top 5 chunks</text><text class="sub" x="359" y="420">Conversation context · threshold</text>
<rect x="635" y="335" width="230" height="110" rx="12" fill="#efe0d3" stroke="#d1b59c" stroke-width="1.5"/><text class="label" x="656" y="371">DeepSeek</text><text class="sub" x="656" y="397">Answer + exact evidence quotes</text><text class="sub" x="656" y="420">JSON · abstention on uncertainty</text>
<path class="arrow" d="M275 390H338"/><path class="arrow" d="M568 390H635"/><path class="arrow" d="M750 251V286H453V335"/><text class="sub" x="580" y="278">Retrieved evidence</text>
<rect class="box" x="925" y="335" width="225" height="110" rx="12"/><text class="label" x="946" y="371">Citation verification</text><text class="sub" x="946" y="397">Check source IDs + exact quotes</text><text class="sub" x="946" y="420">No evidence → human ticket</text><path class="arrow" d="M865 390H925"/>
<rect x="925" y="146" width="225" height="105" rx="12" fill="#e8edde" stroke="#c6d0b7" stroke-width="1.5"/><text class="label" x="946" y="181">Cited answer</text><text class="sub" x="946" y="207">Verifiable source excerpts</text><text class="sub" x="946" y="228">Customer feedback</text><path class="arrow" d="M1038 335V251"/><text class="sub" x="1049" y="294">Supported</text>
<rect class="box" x="925" y="530" width="225" height="105" rx="12"/><text class="label" x="946" y="565">Human inbox</text><text class="sub" x="946" y="591">Ticket · internal note · resolve</text><text class="sub" x="946" y="612">No automatic external messages</text><path class="arrow" d="M1038 445V530"/><text class="sub" x="1049" y="493">Unknown / error</text>
<rect class="box" x="338" y="530" width="527" height="105" rx="12"/><text class="label" x="359" y="565">SQLite · persistent metadata</text><text class="sub" x="359" y="591">Conversations · messages · feedback · documents · tickets</text><text class="sub" x="359" y="612">Admin-protected dashboard · per-conversation access tokens</text><path class="arrow" d="M453 445V530"/><path class="arrow" d="M925 582H865"/>
</svg>
